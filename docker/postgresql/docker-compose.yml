services:
  postgres:
    image: docker.1ms.run/library/postgres:15        # 国内镜像源（原: postgres:15）
    # 备用镜像源（如遇失效替换 image 前缀即可）：
    #   docker.m.daocloud.io/library/postgres:15
    #   dockerproxy.net/library/postgres:15
    #   hub.rat.dev/library/postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: kevin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai       # 设置时区
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:             # 健康检查
      test: ["CMD", "pg_isready", "-U", "nange"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=200"]  # 自定义配置

volumes:
  pgdata: